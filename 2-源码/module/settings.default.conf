# K103 透明锁屏设置（由控制端 App / lockscreen_ctl.sh 修改，约 3 秒热生效，无需重启）
# 图库目录：把 PNG / JPG / JPEG 放进这里（支持一层子目录）
IMAGE_DIR="/sdcard/Pictures/K103_Lockscreen"
# 1=每次锁屏随机换图（推荐，可透出上一帧）；0=固定用当前贴纸
SHUFFLE="1"
# fit=等比居中留边（推荐）；cover=铺满裁剪；stretch=拉伸
SCALE="fit"
# lastframe=透出锁屏前最后一帧（随机/固定模式均生效，默认）；white=纯白底
BG_MODE="lastframe"
# JPEG 质量 1..100
JPEG_QUALITY="92"
# [v1.4 起已弃用] 随机改用洗牌队列：一轮内每张恰好一次，跨轮自动避让，此项保留兼容不再生效
AVOID_RECENT="3"
# 亮屏时读配置间隔秒
INTERVAL="3"
# 熄屏期间是否用 sys.by.app.fullrefresh 请求全刷（0=不碰系统，推荐）
USE_FULLREFRESH="0"
# 跟随帧间隔(轮): 1=每轮约0.5s抓帧(最贴近锁屏前画面,默认); 2=约1s; 4=约2s(省电但滞后)
TRACK_EVERY="1"
# [v1.6] 0=直接原子替换 standby.jpg（推荐，HWC 每次熄屏都会重读）; 1=旧版前台广播（会触发默认图，勿用）
BROADCAST="0"
# [v1.6] 1=亮屏期间帧变化就预合成锁屏图（推荐，透出锁屏前最后一帧）
PRECOMPOSE="1"
# [v1.6] 预合成最小间隔（秒），防止动画/滚动时高频重编码
COMPOSE_MIN_GAP="2"
# [v1.6] 1=启动/熄屏时把 sys.by.standbysetting 归零（防止 HWC 画默认图）
FORCE_STANDBYSETTING="1"